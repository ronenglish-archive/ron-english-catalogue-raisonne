<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Search the Catalogue | Ron English Catalogue Raisonn&eacute;</title>
  
  <style>
/* Search Catalogue - consolidated compact results preview */
:root{--border:#e5e7eb;--muted:#5b6472;--panel:#f6f7f9;--text:#111827}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:#fff}
.wrap{max-width:960px;margin:0 auto;padding:26px 18px 60px}
nav{display:flex;justify-content:center;margin-bottom:26px}nav a{color:inherit;text-decoration:none;border:1px solid var(--border);border-radius:999px;padding:9px 15px;background:#fff}
header{text-align:center;margin-bottom:24px}h1{font-size:clamp(2rem,4vw,3rem);margin:0 0 10px;letter-spacing:-.03em}
.intro{max-width:760px;margin:0 auto;color:var(--muted);line-height:1.6}
.search-box{margin:24px auto 12px;max-width:780px;display:flex;gap:10px}input{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1px solid #cfd5dd;border-radius:10px;outline:none}input:focus{border-color:#6b7280;box-shadow:0 0 0 3px #6b72801f}
.summary{text-align:center;color:var(--muted);min-height:1.5em;margin:8px 0 20px}
.results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:stretch}
.result{display:block;min-width:0;color:inherit;text-decoration:none;border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:#fff;overflow-wrap:anywhere}
.result:hover{background:var(--panel)}.result-title{font-size:15px;font-weight:700;line-height:1.35;margin-bottom:5px}.meta{display:flex;flex-wrap:wrap;gap:5px 10px;color:var(--muted);font-size:12px;line-height:1.4}.work-id{font-weight:700;color:#374151}.status-missing{font-style:italic}
.empty{text-align:center;color:var(--muted);padding:30px 10px;grid-column:1/-1}
footer{margin-top:34px;padding-top:18px;border-top:1px solid var(--border);text-align:center;color:var(--muted);font-size:13px}
@media(max-width:680px){.results{grid-template-columns:1fr}.wrap{padding:22px 14px 48px}}

</style>
<link rel="icon" type="image/png" href="https://ronenglish-archive.github.io/ron-english-catalogue-raisonne/favicon.png">
</head>
<body>
  <main class="wrap">
    <nav><a href="../">Catalogue home</a></nav>
    <header>
      <h1>Search the Catalogue</h1>
      <p class="intro">Search by Work ID, title, category, series, or year. The index is generated from pages reachable through the public catalogue navigation.</p>
    </header>

    <div class="search-box">
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search Work ID or title..." aria-label="Search catalogue">
    </div>
    <div id="summary" class="summary">Loading catalogue index...</div>
    <section id="results" class="results" aria-live="polite"></section>

    <footer id="footer"></footer>
  </main>

<script>
(function(){
  "use strict";

  var input = document.getElementById("q");
  var resultsEl = document.getElementById("results");
  var summaryEl = document.getElementById("summary");
  var footerEl = document.getElementById("footer");
  var records = [];

  function normalizeText(value){
    return String(value || "").toLowerCase().replace(/[^a-z0-9]+/g," ").replace(/\s+/g," ").trim();
  }

  function normalizeId(value){
    return String(value || "").toUpperCase().replace(/[^A-Z0-9]/g,"");
  }

  function escapeHtml(value){
    return String(value || "")
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#39;");
  }

  function scoreRecord(record, rawQuery){
    var qText = normalizeText(rawQuery);
    var qId = normalizeId(rawQuery);
    var score = 0;
    // RON-AUTHORITATIVE-ID-SEARCH-FIX-V1
    // Work-ID-shaped queries must match authoritative metadata only.
    // Never let legacy URL filenames or arbitrary search_text satisfy these queries.
    // RON-AUTHORITATIVE-ID-SEARCH-FIX-V2: numeric-only Work IDs are IDs too.
    // Keep ordinary four-digit year queries (e.g. 2018) as text searches.
    var trimmedQuery = String(rawQuery || "").trim();
    var numericWorkId = /^\d{5,6}(?:[- ]?[A-Za-z])?$/.test(trimmedQuery) || /^0\d{3,6}(?:[- ]?[A-Za-z])?$/.test(trimmedQuery);
    if (/^RE[\s-]*\d/i.test(trimmedQuery) || numericWorkId) {
      if (numericWorkId) { qId = "RE" + qId; }
      var ids = Array.isArray(record.work_ids) && record.work_ids.length
        ? record.work_ids
        : (record.work_id ? [record.work_id] : []);
      for (var idIndex = 0; idIndex < ids.length; idIndex++) {
        var canonicalId = normalizeId(ids[idIndex]);
        if (canonicalId === qId) { return 1000; }
        if (qId.length < canonicalId.length && canonicalId.indexOf(qId) === 0) {
          score = 650;
        }
      }
      return score;
    }

    if(qId && record.search_id){
      if(record.search_id === qId){ score += 1000; }
      else if(record.search_id.indexOf(qId) === 0){ score += 650; }
      else if(record.search_id.indexOf(qId) >= 0){ score += 450; }
    }

    var titleNorm = normalizeText(record.title);
    if(qText){
      if(titleNorm === qText){ score += 800; }
      else if(titleNorm.indexOf(qText) === 0){ score += 500; }
      else if(titleNorm.indexOf(qText) >= 0){ score += 300; }

      var tokens = qText.split(" ").filter(Boolean);
      var allTokens = true;
      for(var i=0;i<tokens.length;i++){
        if(record.search_text.indexOf(tokens[i]) < 0){
          allTokens = false;
          break;
        }
      }
      if(allTokens){ score += 120; }
    }

    return score;
  }

  function resultHtml(record){
    var bits = [];
    if(record.work_id){
      var cls = record.work_id_status === "missing" ? "work-id status-missing" : "work-id";
      bits.push('<span class="' + cls + '">' + escapeHtml(record.work_id) + '</span>');
    } else if(record.work_id_status === "missing"){
      bits.push('<span class="work-id status-missing">Work ID unavailable</span>');
    }

    if(record.section){ bits.push("<span>" + escapeHtml(record.section) + "</span>"); }
    if(record.category && record.category !== record.section){ bits.push("<span>" + escapeHtml(record.category) + "</span>"); }
    if(record.series){ bits.push("<span>" + escapeHtml(record.series) + "</span>"); }
    if(record.year){ bits.push("<span>" + escapeHtml(record.year) + "</span>"); }

    return '<a class="result" href="' + escapeHtml(record.url) + '">' +
      '<div class="result-title">' + escapeHtml(record.title || "Untitled") + '</div>' +
      '<div class="meta">' + bits.join("") + '</div>' +
      '</a>';
  }

  function render(){
    var raw = input.value.trim();

    if(!raw){
      summaryEl.textContent = records.length.toLocaleString() + " indexed catalogue records. Start typing to search.";
      resultsEl.innerHTML = "";
      return;
    }

    var scored = [];
    for(var i=0;i<records.length;i++){
      var score = scoreRecord(records[i], raw);
      if(score > 0){
        scored.push({score:score, record:records[i]});
      }
    }

    scored.sort(function(a,b){
      if(b.score !== a.score){ return b.score - a.score; }
      return String(a.record.title || "").localeCompare(String(b.record.title || ""));
    });

    var max = 100;
    var visible = scored.slice(0,max);
    summaryEl.textContent = scored.length.toLocaleString() + " match" + (scored.length === 1 ? "" : "es") +
      (scored.length > max ? " (showing first " + max + ")" : "") + ".";

    if(!visible.length){
      resultsEl.innerHTML = '<div class="empty">No catalogue records matched this search.</div>';
      return;
    }

    resultsEl.innerHTML = visible.map(function(x){ return resultHtml(x.record); }).join("");
  }

  fetch("search-data.json", {cache:"no-store"})
    .then(function(response){
      if(!response.ok){ throw new Error("HTTP " + response.status); }
      return response.json();
    })
    .then(function(data){
      records = Array.isArray(data.records) ? data.records : [];
      summaryEl.textContent = records.length.toLocaleString() + " indexed catalogue records. Start typing to search.";
      footerEl.textContent = "Generated index: " + new Date(data.generated_utc).toLocaleString();
      input.addEventListener("input", render);
      input.focus();
    })
    .catch(function(error){
      summaryEl.textContent = "The search index could not be loaded.";
      resultsEl.innerHTML = '<div class="empty">' + escapeHtml(error.message) + '</div>';
    });
})();
</script>
</body>
</html>
